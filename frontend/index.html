<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watershed Explorer — where does your rain go?</title>
    <meta name="description" content="Follow the rain that falls on any US address from the roof to the creek to the sea, and see the watersheds, soil, life and history of the place it crosses." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Watershed Explorer — where does your rain go?" />
    <meta property="og:description" content="Follow the rain on any US address from roof to creek to sea, through every watershed it crosses." />
    <meta property="og:url" content="https://www.aeholbrook.com/watersheds/" />
    <meta property="og:image" content="https://www.aeholbrook.com/watersheds/og.jpg" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2C11 10 6 15 6 21a10 10 0 0 0 20 0c0-6-5-11-10-19z' fill='%232a78d6'/></svg>" />
    <script>
      // Set the theme before the first paint (src/theme.ts keeps it in step afterwards).
      try {
        var t = localStorage.getItem("watersheds-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
